:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#172335;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px 15px 45px}.hero{padding:18px 2px 8px}.eyebrow{color:#48617f;font-size:13px;font-weight:700;letter-spacing:.08em}h1{font-size:25px;line-height:1.4;margin:5px 0 8px}.sub{color:#53657a;line-height:1.65;margin:0 0 14px}.panel{background:white;border:1px solid #dce4ee;border-radius:17px;padding:18px;margin:13px 0;box-shadow:0 3px 16px #253a5510}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}select,button{font:inherit;border-radius:12px;min-height:47px}select{background:white;border:1px solid #9bacbd;padding:8px;max-width:100%;flex:1}button{border:1px solid #b8c9dd;background:#fff;padding:10px 15px;cursor:pointer;font-weight:650;color:#17344e}button.primary{background:#1458a4;color:#fff;border-color:#1458a4}button:disabled{opacity:.45;cursor:default}.progress{height:9px;border-radius:12px;background:#e5ebf2;overflow:hidden;margin:12px 0}.fill{height:100%;background:#2975c6;width:0;transition:width .2s}.meta{font-size:13px;color:#61748c;display:flex;justify-content:space-between;gap:10px}.question{font-size:20px;font-weight:750;line-height:1.65;white-space:pre-wrap;margin:19px 0}.options{display:grid;gap:11px}.choice{width:100%;display:flex;text-align:left;align-items:center;gap:13px;min-height:65px;padding:14px;border:2px solid #d4deea;border-radius:13px;line-height:1.5;background:white;font-weight:500}.choice .num{background:#eaf0f7;border-radius:9px;min-width:35px;height:35px;display:grid;place-items:center;font-weight:800;color:#1b5188}.choice.selected{border-color:#296bb7;background:#f0f7ff}.choice.correct{border-color:#2b9762;background:#eefbf3}.choice.wrong{border-color:#c94d54;background:#fff1f1}.feedback{margin-top:15px;padding:14px;border-radius:12px;line-height:1.7}.feedback.good{background:#e9f7ed;color:#16633a}.feedback.bad{background:#fff1ec;color:#8c3828}.muted{color:#68788c;font-size:13px;line-height:1.6}.hidden{display:none!important}.bottom{display:flex;gap:9px;margin-top:18px}.bottom button{flex:1}.tag{display:inline-block;background:#eaf2fb;border-radius:8px;padding:4px 9px;color:#2b5f98;font-size:12px;font-weight:750}.summary{font-size:28px;font-weight:800;color:#1559a4}.review{border-top:1px solid #e4eaf2;padding:13px 0;line-height:1.65}.review:first-child{border-top:0}.review .small{font-size:12px;color:#697b8f}.linklike{color:#1458a4;text-decoration:underline;background:none;border:0;min-height:0;padding:0}footer{font-size:12px;color:#6c7c90;line-height:1.6;padding:12px 3px}@media(prefers-color-scheme:dark){:root{background:#111b29;color:#eaf0f7}.panel{background:#1b2b3e;border-color:#35485e}.sub,.muted,.meta{color:#b0bfd0}.choice,select,button{background:#20354c;color:#eaf0f7;border-color:#4b637c}.choice .num{background:#2e4d6a;color:#eaf0f7}.choice.selected{background:#183f68}.choice.correct{background:#194a38}.choice.wrong{background:#562b30}.feedback.good{background:#194a38;color:#c5f8dc}.feedback.bad{background:#562b30;color:#ffd7d2}.tag{background:#2b4765;color:#d7eaff}.review{border-color:#35485e}}
</style></head><body><main><header class="hero"><div class="eyebrow">スマホで学習・オフライン対応</div><h1>一般常識 過去問90問</h1><p class="sub">選択肢をタップ →「答え合わせ」→ 次の問題。解答済み・間違えた問題も確認できます。</p></header><section class="panel"><div class="toolbar"><select id="group" aria-label="出題範囲"></select><select id="mode" aria-label="復習モード"><option value="all">全問</option><option value="wrong">間違えた問題</option><option value="unanswered">未回答</option></select></div><div class="progress"><div class="fill" id="fill"></div></div><div class="meta"><span id="global"></span></div></section><section id="view" class="panel"><div class="meta"><span id="category" class="tag"></span><span id="position"></span></div><div class="question" id="q"></div><div class="options" id="choices"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="bottom"><button id="prev">前へ</button><button id="check" class="primary">答え合わせ</button><button id="next">次へ</button></div></section><section class="panel hidden" id="empty"></section><section class="panel"><div class="toolbar"><button id="summaryButton">得点・間違い一覧</button><button id="reset">最初からやり直す</button></div></section><section id="summary" class="panel hidden"><h2>学習結果</h2><p class="summary" id="score"></p><h3>間違えた問題</h3><div id="review"></div></section><footer>問題・解答は元のWord問題集に準拠しています。年度を指定した問題は当時の内容です。保存機能はブラウザの設定によって利用できない場合があります。インターネット接続は不要です。</footer></main><script>
const ALL=[{"id": "R2-1", "group": "令和2年度", "q": "マイナンバーカード保有者を対象に、2020 年 9 月～21 年 3 月末までキャッシュレス決済で買い物をした際に 25％の還元を受けられる制度を何というか。", "options": ["マイナポイント制度", "マイナイナ制度", "マイポイント還元制度"], "answer": 0, "note": ""}, {"id": "R2-2", "group": "令和2年度", "q": "2020 年 1 月に「英国の EU 離脱」を実現した、第 77 代英国の首相は誰か。", "options": ["ボリス・ジョンソン", "ジャスティン・トルドー", "エマニュエル・マクロン"], "answer": 0, "note": ""}, {"id": "R2-3", "group": "令和2年度", "q": "3．中国が主導し、アジア各国のインフラ整備を目的に設立された国際金融機関は何か。", "options": ["一帯一路整備銀行", "中国建設銀行", "アジアインフラ投資銀行"], "answer": 2, "note": ""}, {"id": "R2-4", "group": "令和2年度", "q": "泥や砂が固まってできる頁岩から採取される天然ガスを何というか。", "options": ["シェールガス", "メタンハイドレート", "LNG"], "answer": 0, "note": ""}, {"id": "R2-5", "group": "令和2年度", "q": "スウェーデンの大学教授が提唱した「IT の浸透が人々の生活をあらゆる面でより良い方向に 変化させる」という概念を何というか。", "options": ["IoT", "OEM", "DX"], "answer": 2, "note": ""}, {"id": "R2-6", "group": "令和2年度", "q": "高齢ドライバーによる事故が相次いだことを背景に、2021 年 11 月以降に販売される国産の新 型車を対象に、搭載が義務付けられるものは何か。", "options": ["ドライブレコーダー", "自動ブレーキ", "踏み間違い防止装置"], "answer": 1, "note": ""}, {"id": "R2-7", "group": "令和2年度", "q": "静岡から九州近辺まで延びる海底の深い溝で、大規模な活断層を何というか。", "options": ["最上トラフ", "南海トラフ", "太平洋トラフ"], "answer": 1, "note": ""}, {"id": "R2-8", "group": "令和2年度", "q": "2019 年 4 月、国立天文台などの国際研究チームが世界中の電波望遠鏡を結合させ、撮影に成功した天体は何か。", "options": ["海王星", "リュウグウ", "ブラックホール"], "answer": 2, "note": ""}, {"id": "R2-9", "group": "令和2年度", "q": "職場でのいじめや嫌がらせを防ぐことを目的に 2019 年 5 月に成立した法律の通称名は何か。", "options": ["健康増進法", "パワハラ防止法", "職場環境改善法"], "answer": 1, "note": ""}, {"id": "R2-10", "group": "令和2年度", "q": "2020 年 4 月から実施された低所得世帯の学生を対象に、大学などの高等教育を受けられる ように支援する施策を一般に何というか。", "options": ["高等教育の無償化", "教育活動支援金制度", "低所得者教育補助金"], "answer": 0, "note": ""}, {"id": "R2-11", "group": "令和2年度", "q": "通常国会は、1 年に何回召集されるか。", "options": ["1 回", "3 回", "12 回"], "answer": 0, "note": ""}, {"id": "R2-12", "group": "令和2年度", "q": "憲法改正では、衆参両院それぞれの総議員のどれだけの賛成が必要か。", "options": ["2 分の 1 以上", "3 分の 2 以上", "4 分の 3 以上"], "answer": 1, "note": ""}, {"id": "R2-13", "group": "令和2年度", "q": "需要と供給の wer": 2, "note": ""}, {"id": "R4-12", "group": "令和4年度", "q": "2020年の国勢調査での日本の人口と世帯について、正しい記述はどれか。", "options": ["世帯構成では「単身世帯」の割合が最も多い", "人口に占める外国人の割合が初めて 1％を超えた", "高齢者（65 歳以上）の割合が初めて 25％を超えた"], "answer": 0, "note": ""}, {"id": "R4-13", "group": "令和4年度", "q": "日本標準時子午線が通っている都道府県は。", "options": ["兵庫県", "三重県", "神奈川県"], "answer": 0, "note": ""}, {"id": "R4-14", "group": "令和4年度", "q": "事態を「シュウシュウ」する、カタカナを漢字にするとどれか。", "options": ["収集", "収拾", "集収"], "answer": 1, "note": ""}, {"id": "R4-15", "group": "令和4年度", "q": "余罪を「ツイキュウ」 する、カタカナを漢字にするとどれか。", "options": ["追求", "追及", "追究"], "answer": 1, "note": ""}, {"id": "R5-1", "group": "令和5年度", "q": "2022年7月に、NATO（北大西洋条約機構）の加盟手続きが正式に始まった国はどれか。", "options": ["スウェーデン", "ウクライナ", "トルコ"], "answer": 0, "note": ""}, {"id": "R5-2", "group": "令和5年度", "q": "国連安全保障理事会の常任理事国は何カ国か。", "options": ["５", "１０", "１５"], "answer": 0, "note": ""}, {"id": "R5-3", "group": "令和5年度", "q": "2022年の日本の食料自給率（カロリーベース）はおおよそ何%か。", "options": ["２１", "３８", "５２"], "answer": 1, "note": ""}, {"id": "R5-4", "group": "令和5年度", "q": "衆議院の選挙制度で採用している選挙区制はどれか。", "options": ["大選挙区制", "中選挙区制", "小選挙区制"], "answer": 2, "note": ""}, {"id": "R5-5", "group": "令和5年度", "q": "世界貿易機関を通称何というか。", "options": ["IMF", "ILO", "WTO"], "answer": 2, "note": ""}, {"id": "R5-6", "group": "令和5年度", "q": "絶滅の危機に瀕している野生動植物の取引を規制している条約を何というか。", "options": ["ハーグ条約", "シンガポール条約", "ワシントン条約"], "answer": 2, "note": ""}, {"id": "R5-7", "group": "令和5年度", "q": "温室効果ガスの排出量と植林等による吸収量を差し引きでゼロの状態にすることを何というか。", "options": ["カーボンオフセット", "カーボンプライシング", "カーボンニュートラル"], "answer": 2, "note": ""}, {"id": "R5-8", "group": "令和5年度", "q": "2015年に採択され、2020年以降の世界各国の温室効果ガスの削減目標を策定した協定を何というか。", "options": ["パリ協定", "京都議定書", "ウルグアイラウンド"], "answer": 0, "note": ""}, {"id": "R5-9", "group": "令和5年度", "q": "国がすべての国民に対して最低限の生活を送るために必要な現金を、一律で無条件に支給する政策を何というか。", "options": ["マネタリーベース", "トリクルダウン", "ベーシックインカム"], "answer": 2, "note": ""}, {"id": "R5-10", "group": "令和5年度", "q": "公的年金の給付水準を調整するための考え方で、人口の減少と平均余命の伸びにより給付額を調整するしくみを何というか。", "options" WWF"], "answer": 1, "note": ""}, {"id": "R7-8", "group": "令和7年度", "q": "企業における事業継続計画を何と呼ぶか。", "options": ["NPT", "FTA", "BCP"], "answer": 2, "note": ""}, {"id": "R7-9", "group": "令和7年度", "q": "温室効果ガスの排出量と植林等による吸収量を差し引きでゼロの状態にすることを何というか。", "options": ["カーボンオフセット", "カーボンプライシング", "カーボンニュートラル"], "answer": 2, "note": ""}, {"id": "R7-10", "group": "令和7年度", "q": "産業分類上、農業、林業、漁業、鉱業などの産業を何というか。", "options": ["第一次産業", "第二次産業", "第三次産業"], "answer": 0, "note": ""}, {"id": "R7-11", "group": "令和7年度", "q": "国や企業の経済状況を示す指標で、経済の基礎的条件と訳される語句はどれか。", "options": ["ファンダメンタルズ", "プライマリーバランス", "エコバランス"], "answer": 0, "note": ""}, {"id": "R7-12", "group": "令和7年度", "q": "次世代育成支援対策推進法に基づく認定制度のひとつで、認定企業に与えられる認定名称はどれか。", "options": ["くるみん", "そらから", "みちびき"], "answer": 0, "note": ""}, {"id": "R7-13", "group": "令和7年度", "q": "地球温暖化に対する研究結果を共有する会議である「気候変動に関する政府間パネル」の略称を何というか。", "options": ["COP", "IPCC", "WFP"], "answer": 1, "note": ""}, {"id": "R7-14", "group": "令和7年度", "q": "父は事業の再建に「フシン」した、カタカナを適切な漢字にするとどれか。", "options": ["不振", "腐心", "普請"], "answer": 1, "note": ""}, {"id": "R7-15", "group": "令和7年度", "q": "2025年の大阪・関西万博の公式キャラクターの愛称はどれか。", "options": ["ドキドキ", "ワクワク", "ミャクミャク"], "answer": 2, "note": ""}];const TITLE="一般常識 過去問90問";const STORE="past-quiz-90-v1";
let group='all',mode='all',items=[],index=0,selected={},revealed={};
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(STORE,JSON.stringify({group,mode,index,selected,revealed}));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function filter(){let v=ALL.filter(x=>group==='all'||x.group===group);if(mode==='wrong'){v=v.filter(x=>selected[x.id]!==undefined&&selected[x.id]!==x.answer)}if(mode==='unanswered'){v=v.filter(x=>selected[x.id]===undefined)}return v}
function setup(){let groups=[...new Set(ALL.map(x=>x.group))];$('group').innerHTML='<option value="all">すべての問題</option>'+groups.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');let old=load();if(old){group=old.group||'all';mode=old.mode||'all';index=old.index||0;selected=old.selected||{};revealed=old.revealed||{}}if(!groups.includes(group))group='all';$('group').value=group;$('mode').value=mode;refresh()}
function refresh(){items=filter();index=Math.min(Math.max(0,index),Math.max(0,items.length-1));let total=ALL.length,done=ALL.filter(x=>selected[x.id]!==undefined).length,correct=ALL.filter(x=>selected[x.id]===x.answer).length;$('global').textContent=`全体の解答済み ${done}/${total}問 ／ 正解 ${correct}問`;$('fill').style.width=(done/total*100)+'%';$('view').classList.toggle('hidden',items.length===0);$('empty').classList.toggle('hidden',items.length!==0);$('empty').textContent=mode==='wrong'?'現在、この条件に該当する間違い問題はありません。':'この条件に該当する未回答問題はありません。';if(!items.length){save();return}let x=items[index],answer=selected[x.id],show=!!revealed[x.id];$('position').textContent=`${index+1} / ${items.length}問`;$('category').textContent=x.group;$('q').textContent=x.q;$('choices').innerHTML=x.options.map((v,i)=>{let klass=show?(i===x.answer?'correct':i===answer?'wrong':''):(i===answer?'selected':'');return `<button type="button" class="choice ${klass}" data-choice="${i}" ${show?'disabled':''}><span class="num">${'①②③'[i]}</span><span>${escapeHtml(v)}</span></button>`}).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));$('check').disabled=answer===undefined||show;$('check').classList.toggle('hidden',show);$('feedback').classList.toggle('hidden',!show);if(show){let ok=answer===x.answer;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=`<b>${ok?'正解！':'不正解'}</b><br>正解：${'①②③'[x.answer]} ${escapeHtml(x.options[x.answer])}`+(x.note?`<br><span style="font-size:14px">${escapeHtml(x.note)}</span>`:'')} $('prev').disabled=index===0;$('next').disabled=index===items.length-1;save()}
function choose(i){let x=items[index];if(revealed[x.id])return;selected[x.id]=i;refresh()}
$('check').onclick=()=>{let x=items[index];if(selected[x.id]===undefined)return;revealed[x.id]=true;refresh()};$('prev').onclick=()=>{index--;refresh();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{index++;refresh();window.scrollTo({top:0,behavior:'smooth'})};$('group').onchange=e=>{group=e.target.value;index=0;refresh()};$('mode').onchange=e=>{mode=e.target.value;index=0;refresh()};$('summaryButton').onclick=()=>{let answered=ALL.filter(x=>selected[x.id]!==undefined),correct=answered.filter(x=>selected[x.id]===x.answer),wrong=answered.filter(x=>selected[x.id]!==x.answer);$('summary').classList.toggle('hidden');$('score').textContent=`${correct.length} / ${answered.length}問 正解（全${ALL.length}問）`;$('review').innerHTML=wrong.length?wrong.map(x=>`<div class="review"><div class="small">${escapeHtml(x.group)}・${escapeHtml(x.id)}</div><b>${escapeHtml(x.q)}</b><br>あなたの答え：${'①②③'[selected[x.id]]} ${escapeHtml(x.options[selected[x.id]])}<br><b>正解：${'①②③'[x.answer]} ${escapeHtml(x.options[x.answer])}</b>${x.note?'<br>'+escapeHtml(x.note):''}</div>`).join(''):'解答済みの問題に間違いはありません。';$('summary').scrollIntoView({behavior:'smooth'})};$('reset').onclick=()=>{if(confirm('この問題集の解答履歴をすべて消去しますか？')){selected={};revealed={};index=0;mode='all';group='all';$('mode').value='all';$('group').value='all';$('summary').classList.add('hidden');refresh()}};setup();
</script></body></html>
